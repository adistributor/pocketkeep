<style>
:root{
  color-scheme: light;
  --ink:#1A1726; --muted:#5F5A6B; --paper:#FFFFFF; --wash:#F3F1FC; --line:rgba(26,23,38,.10);
  --violet:#5B4FE8; --violet-2:#8A7CFF; --green:#0B9C68; --red:#DA3B2F;
  --night:#1E1E2E; --night-2:#2A2A3E; --night-ink:#F2F1F7; --night-muted:#B9B6C9;
  --font: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --ink:#F2F1F7; --muted:#B9B6C9; --paper:#1E1E2E; --wash:#252537; --line:rgba(255,255,255,.10);
    --violet:#8F88FF; --violet-2:#9A8CFF; --green:#00D4AA; --red:#FF6B6B;
    --night:#15151F; --night-2:#2A2A3E;
  }
}
html[lang="ar"]{ --font: "Tajawal", "Poppins", system-ui, sans-serif; }
*{ box-sizing:border-box; }
html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--font); font-size:1.0625rem; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html[lang="ar"] body{ font-size:1.125rem; line-height:1.75; }
a{ color:inherit; }
:focus-visible{ outline:3px solid var(--violet-2); outline-offset:3px; border-radius:6px; }
.wrap{ width:min(1080px, 100% - 2.5rem); margin-inline:auto; }

/* ---------- top / hero (always the app's night palette) ---------- */
.top{
  background:var(--night); color:var(--night-ink);
  padding-top: env(safe-area-inset-top, 0px);
}
.bar{ display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:1.25rem 0; }
.brand{ display:flex; align-items:center; gap:.6rem; text-decoration:none; font-weight:600; font-size:1.15rem; letter-spacing:-.01em; }
.brand svg{ flex:none; }
.lang{
  font:inherit; font-size:.95rem; font-weight:500; color:var(--night-ink);
  background:transparent; border:1px solid rgba(255,255,255,.22); border-radius:999px;
  padding:.4rem 1rem; cursor:pointer;
}
.lang:hover{ background:rgba(255,255,255,.08); }
.lang [data-ar-font]{ font-family:"Tajawal", sans-serif; }

.hero{ display:grid; grid-template-columns: 1.1fr .9fr; gap:3rem; align-items:center; padding:2.5rem 0 4.5rem; }
.hero h1{
  margin:0 0 1.25rem; font-weight:700; letter-spacing:-.025em;
  font-size:clamp(2.4rem, 5.2vw, 4rem); line-height:1.05;
}
html[lang="ar"] .hero h1{ letter-spacing:0; line-height:1.25; font-weight:800; }
.hero h1 span{ display:block; }
.hero p.lede{ margin:0 0 2rem; max-width:34ch; font-size:1.15rem; color:var(--night-muted); }
.cta{ display:flex; flex-wrap:wrap; gap:1rem; align-items:center; }
.play{
  display:inline-flex; align-items:center; gap:.7rem; text-decoration:none;
  background:#FFFFFF; color:#1A1726; border-radius:14px; padding:.8rem 1.3rem;
  font-weight:600; font-size:1rem;
}
.play:hover{ background:#ECEAFB; }
.play small{ display:block; font-weight:400; font-size:.75rem; opacity:.7; line-height:1.2; }
.play b{ display:block; font-weight:600; line-height:1.2; }
.note{ font-size:.9rem; color:var(--night-muted); }

/* ---------- the phone: the one bold thing ---------- */
.phone{
  justify-self:center; width:min(300px, 100%); aspect-ratio: 9 / 18.5;
  background:#252537; border-radius:40px; padding:14px;
  box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 30px 80px -20px rgba(91,79,232,.55);
}
.screen{ height:100%; border-radius:28px; background:#1E1E2E; overflow:hidden; display:flex; flex-direction:column; padding:18px 16px; gap:14px; color:#F2F1F7; font-size:.78rem; }
.s-head{ display:flex; justify-content:space-between; align-items:center; color:#B9B6C9; font-size:.72rem; }
.balance{
  border-radius:20px; padding:16px; color:#fff;
  background: linear-gradient(135deg, #6C63FF, #9A8CFF);
}
.balance .lbl{ opacity:.85; font-size:.72rem; }
.balance .amt{ font-size:1.55rem; font-weight:600; letter-spacing:-.01em; direction:ltr; unicode-bidi:isolate; display:block; text-align:start; }
.balance .sub{ display:flex; gap:12px; margin-top:8px; font-size:.7rem; opacity:.95; }
.wallets{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.wallet{ background:#2A2A3E; border-radius:14px; padding:10px; }
.wallet .n{ color:#B9B6C9; font-size:.68rem; }
.wallet .v{ font-weight:600; direction:ltr; unicode-bidi:isolate; display:block; text-align:start; }
.list{ display:flex; flex-direction:column; gap:2px; }
.list h3{ margin:0 0 4px; font-size:.72rem; font-weight:500; color:#B9B6C9; }
.row{ display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid rgba(255,255,255,.05); }
.row .ic{ width:28px; height:28px; border-radius:50%; display:grid; place-items:center; background:#333742; font-size:.85rem; flex:none; }
.row .t{ flex:1; min-width:0; }
.row .t small{ display:block; color:#8E8AA0; font-size:.64rem; }
.row .m{ font-weight:600; direction:ltr; unicode-bidi:isolate; }
.row .m.out{ color:#FF6B6B; } .row .m.in{ color:#00D4AA; }

/* ---------- sections ---------- */
section{ padding:5rem 0; }
section h2{ margin:0 0 .75rem; font-size:clamp(1.7rem, 3vw, 2.3rem); line-height:1.15; letter-spacing:-.02em; font-weight:600; }
html[lang="ar"] section h2{ letter-spacing:0; line-height:1.4; font-weight:700; }
section .intro{ margin:0 0 2.5rem; max-width:60ch; color:var(--muted); }

.promise{ background:var(--wash); }
.promise ul{ list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(3, 1fr); gap:2.5rem; }
.promise li{ border-top:3px solid var(--violet); padding-top:1rem; }
.promise li b{ display:block; font-size:1.2rem; font-weight:600; margin-bottom:.35rem; }
.promise li span{ color:var(--muted); }

.features{ display:grid; grid-template-columns:repeat(2, 1fr); gap:1.75rem 3rem; margin:0; padding:0; list-style:none; }
.features li{ display:grid; grid-template-columns:2.5rem 1fr; gap:1rem; align-items:start; }
.features svg{ width:2.5rem; height:2.5rem; padding:.55rem; border-radius:12px; background:var(--wash); color:var(--violet); }
.features b{ display:block; font-weight:600; }
.features span{ color:var(--muted); font-size:1rem; }

.plans{ display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; }
.plan{ border:1px solid var(--line); border-radius:20px; padding:1.75rem; }
.plan.plus{ border:2px solid var(--violet); }
.plan h3{ margin:0 0 .25rem; font-size:1.25rem; font-weight:600; }
.plan p{ margin:0 0 1rem; color:var(--muted); }
.plan ul{ margin:0; padding-inline-start:1.2rem; }
.plan li{ margin:.35rem 0; }
.plans + .fine{ margin-top:1rem; font-size:.95rem; color:var(--muted); }

/* ---------- footer ---------- */
footer{ background:var(--night); color:var(--night-ink); padding:3.5rem 0 2.5rem; }
.foot{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:2rem; align-items:flex-start; }
.foot h2{ margin:0 0 1rem; font-size:1.3rem; font-weight:600; }
.social{ display:flex; gap:.75rem; }
.social a{
  width:48px; height:48px; border-radius:50%; display:grid; place-items:center;
  border:1px solid rgba(255,255,255,.2); color:var(--night-ink);
}
.social a:hover{ background:rgba(255,255,255,.08); }
.links{ display:flex; flex-direction:column; gap:.5rem; }
.links a{ color:var(--night-muted); text-decoration:none; }
.links a:hover{ color:var(--night-ink); text-decoration:underline; }
.copy{ margin-top:2.5rem; font-size:.85rem; color:var(--night-muted); }

@media (max-width: 860px){
  .hero{ grid-template-columns:1fr; gap:2.5rem; padding-bottom:3.5rem; }
  .promise ul, .features, .plans{ grid-template-columns:1fr; }
  section{ padding:3.5rem 0; }
}
@media (prefers-reduced-motion: no-preference){
  .phone{ animation: rise .7s cubic-bezier(.2,.7,.2,1) both .1s; }
  @keyframes rise{ from{ transform:translateY(24px); opacity:0; } to{ transform:none; opacity:1; } }
}
</style>

function pickInitial(){
  try{
    const q = new URLSearchParams(location.search).get("lang");
    if (q === "ar" || q === "en") return q;
    const saved = localStorage.getItem("pk-lang");
    if (saved === "ar" || saved === "en") return saved;
  }catch(e){}
  return (navigator.language || "").toLowerCase().startsWith("ar") ? "ar" : "en";
}

function apply(lang){
  const d = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = d.title;
  document.querySelectorAll("[data-i]").forEach(el => {
    const k = el.getAttribute("data-i");
    if (d[k] !== undefined) el.textContent = d[k];
  });
  const btn = document.getElementById("langBtn");
  btn.textContent = d.langBtn;
  btn.style.fontFamily = lang === "ar" ? "Poppins, sans-serif" : "Tajawal, sans-serif";
  btn.setAttribute("lang", lang === "ar" ? "en" : "ar");
  btn.setAttribute("aria-label", lang === "ar" ? "Switch to English" : "التبديل إلى العربية");
  try{ localStorage.setItem("pk-lang", lang); }catch(e){}
}

let current = pickInitial();
apply(current);
document.getElementById("langBtn").addEventListener("click", () => {
  current = current === "ar" ? "en" : "ar";
  apply(current);
});
